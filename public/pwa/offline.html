<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    >
    <meta
      name="theme-color"
      content="#2563eb"
    >
    <title>Rx Box — Offline</title>

    <style>
      body {
        font: 18px system-ui;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
      }

      main {
        max-width: 30rem;
        padding: 2rem;
      }

      button {
        font: inherit;
        background: #2563eb;
        color: white;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>You are offline</h1>

      <p>
        Connect to the internet to view your
        medication schedule and current records.
      </p>

      <p>
        Rx Box needs an internet connection to
        receive device notifications.
      </p>

      <button onclick="location.reload()">
        Try again
      </button>
    </main>
  </body>
</html>
